name: Create release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  release:
    name: Compute version, update changelog, and publish GitHub release
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require default branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Run this workflow from ${{ github.event.repository.default_branch }}."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare release artifacts
        id: prepare
        run: |
          python scripts/release.py prepare \
            --release-notes-file "${RUNNER_TEMP}/release-notes.md" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit release metadata
        run: |
          git add pyproject.toml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release metadata changes to commit."
          else
            printf '%s\n' \
              "chore(release): publish ${{ steps.prepare.outputs.tag_name }} from tracked changes" \
              "" \
              "This release commit records the version bump and changelog entry that" \
              "correspond to the next GitHub release emitted from the default branch." \
              "" \
              "Constraint: Release creation must remain idempotent on subsequent release commits" \
              "Rejected: Manual release-only workflow dispatch | did not match the expected push-to-release behavior" \
              "Confidence: high" \
              "Scope-risk: narrow" \
              "Directive: Keep the release commit prefix stable so the workflow skip condition prevents loops" \
              "Tested: GitHub Actions release workflow path" \
              "Not-tested: Downstream container publication on GitHub-hosted infrastructure" \
              > /tmp/release-commit-message.txt
            git commit -F /tmp/release-commit-message.txt
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create and push release tag
        run: |
          git tag "${{ steps.prepare.outputs.tag_name }}"
          git push origin "${{ steps.prepare.outputs.tag_name }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prepare.outputs.tag_name }}" \
            --title "${{ steps.prepare.outputs.tag_name }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
