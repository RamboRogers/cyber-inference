name: Publish containers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to publish images for; defaults to a llama.cpp refresh tag
        required: false
        type: string
      force_rebuild:
        description: Rebuild even if the published Thor image already has the latest llama.cpp tag
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub cron is UTC. These two windows cover 2:00 AM America/New_York
    # across EST/EDT; the metadata job gates out the non-local-2AM run.
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/ramborogers/cyber-inference

jobs:
  llama-cpp-refresh:
    name: Resolve llama.cpp refresh metadata
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      llama_cpp_tag: ${{ steps.resolve.outputs.llama_cpp_tag }}
      llama_cpp_commit: ${{ steps.resolve.outputs.llama_cpp_commit }}
      llama_cpp_url: ${{ steps.resolve.outputs.llama_cpp_url }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

      - name: Log in to GHCR for image metadata
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve publish decision
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          set -euo pipefail

          latest_release="$(curl -fsSL https://api.github.com/repos/ggml-org/llama.cpp/releases/latest)"
          LLAMA_CPP_TAG="$(jq -r '.tag_name' <<<"${latest_release}")"
          LLAMA_CPP_COMMIT="$(jq -r '.target_commitish' <<<"${latest_release}")"
          LLAMA_CPP_URL="$(jq -r '.html_url' <<<"${latest_release}")"

          if [[ -z "${LLAMA_CPP_TAG}" || "${LLAMA_CPP_TAG}" == "null" ]]; then
            echo "Unable to resolve latest llama.cpp release tag." >&2
            exit 1
          fi

          app_version="$(
            python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          if [[ -n "${EVENT_RELEASE_TAG:-}" && "${EVENT_RELEASE_TAG}" != "null" ]]; then
            release_tag="${EVENT_RELEASE_TAG}"
          elif [[ -n "${INPUT_RELEASE_TAG:-}" && "${INPUT_RELEASE_TAG}" != "null" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
          else
            release_tag="v${app_version}-llama-${LLAMA_CPP_TAG}"
          fi

          should_publish=true
          reason="llama.cpp ${LLAMA_CPP_TAG} will be published as ${release_tag}"

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            local_hour="$(TZ=America/New_York date +%H)"
            local_weekday="$(TZ=America/New_York date +%u)"
            if [[ "${local_weekday}" != "1" || "${local_hour}" != "02" ]]; then
              should_publish=false
              reason="Skipping duplicate UTC schedule window; local time is weekday ${local_weekday} hour ${local_hour}."
            fi
          fi

          current_llama_tag=""
          if [[ "${should_publish}" == "true" && "${EVENT_NAME}" != "release" && -z "${INPUT_RELEASE_TAG:-}" && "${FORCE_REBUILD}" != "true" ]]; then
            if labels="$(docker buildx imagetools inspect "${IMAGE_REPO}:thor-arm64" --format '{{json .Image.Config.Labels}}' 2>/dev/null)"; then
              current_llama_tag="$(jq -r '."org.cyberinference.llama-cpp.tag" // empty' <<<"${labels}")"
            fi

            if [[ "$current_llama_tag" == "$LLAMA_CPP_TAG" ]]; then
              should_publish=false
              reason="Published Thor image already contains llama.cpp ${LLAMA_CPP_TAG}."
            elif [[ -n "${current_llama_tag}" ]]; then
              reason="Published Thor image has llama.cpp ${current_llama_tag}; latest is ${LLAMA_CPP_TAG}."
            else
              reason="Published Thor image does not expose a llama.cpp tag label; rebuilding with ${LLAMA_CPP_TAG}."
            fi
          fi

          {
            echo "should_publish=${should_publish}"
            echo "release_tag=${release_tag}"
            echo "llama_cpp_tag=${LLAMA_CPP_TAG}"
            echo "llama_cpp_commit=${LLAMA_CPP_COMMIT}"
            echo "llama_cpp_url=${LLAMA_CPP_URL}"
            echo "reason=${reason}"
          } >> "${GITHUB_OUTPUT}"

          echo "${reason}"

  linux-amd64:
    name: Build and publish Linux AMD64 NVIDIA image
    needs:
      - llama-cpp-refresh
    if: needs.llama-cpp-refresh.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Linux AMD64 image
        env:
          RELEASE_TAG: ${{ needs.llama-cpp-refresh.outputs.release_tag }}
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-linux-amd64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:linux-amd64
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/Dockerfile.linux-amd64 \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_RELEASE}" \
            -t "${IMAGE_FLOATING}" \
            .

      - name: Smoke test runtime llama.cpp install path
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-linux-amd64
        run: |
          docker run --rm --entrypoint /bin/bash "${IMAGE_RELEASE}" -lc '
            uv run cyber-inference install-llama &&
            /app/bin/llama-server --version
          '

      - name: Push Linux AMD64 image
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-linux-amd64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:linux-amd64
        run: |
          docker push "${IMAGE_RELEASE}"
          docker push "${IMAGE_FLOATING}"

  thor-arm64:
    name: Build and publish Thor ARM64 NVIDIA image
    needs:
      - llama-cpp-refresh
    if: needs.llama-cpp-refresh.outputs.should_publish == 'true'
    runs-on: [self-hosted, Linux, ARM64, NVIDIA, Thor]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

      - name: Install llama.cpp build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            ninja-build \
            pkg-config

      - name: Build llama.cpp natively on Thor
        env:
          LLAMA_CPP_TAG: ${{ needs.llama-cpp-refresh.outputs.llama_cpp_tag }}
        run: |
          rm -rf "${RUNNER_TEMP}/llama.cpp"
          git clone --depth 1 --branch "${LLAMA_CPP_TAG}" https://github.com/ggml-org/llama.cpp "${RUNNER_TEMP}/llama.cpp"
          cd "${RUNNER_TEMP}/llama.cpp"
          LLAMA_CPP_COMMIT=$(git rev-parse HEAD)
          echo "LLAMA_CPP_COMMIT=${LLAMA_CPP_COMMIT}" >> "${GITHUB_ENV}"
          cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build --config Release -j$(nproc)

      - name: Stage llama.cpp runtime bundle
        env:
          LLAMA_CPP_TAG: ${{ needs.llama-cpp-refresh.outputs.llama_cpp_tag }}
          LLAMA_CPP_URL: ${{ needs.llama-cpp-refresh.outputs.llama_cpp_url }}
        run: |
          docker/scripts/stage-llama-runtime.sh "${RUNNER_TEMP}/llama.cpp/build" docker/build/llama-bin
          mkdir -p docker/build/llama-bin/llama
          printf 'repo=https://github.com/ggml-org/llama.cpp\ntag=%s\ncommit=%s\nrelease=%s\n' \
            "${LLAMA_CPP_TAG}" \
            "${LLAMA_CPP_COMMIT}" \
            "${LLAMA_CPP_URL}" \
            > docker/build/llama-bin/llama/BUILD_INFO

      - name: Build whisper.cpp natively on Thor
        run: |
          rm -rf "${RUNNER_TEMP}/whisper.cpp"
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp "${RUNNER_TEMP}/whisper.cpp"
          cd "${RUNNER_TEMP}/whisper.cpp"
          WHISPER_COMMIT=$(git rev-parse HEAD)
          echo "WHISPER_CPP_COMMIT=${WHISPER_COMMIT}" >> "${GITHUB_ENV}"
          cmake -B build -DGGML_CUDA=ON -DWHISPER_FFMPEG=ON -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build --config Release -j$(nproc)

      - name: Stage whisper.cpp runtime bundle
        run: |
          docker/scripts/stage-whisper-runtime.sh "${RUNNER_TEMP}/whisper.cpp/build" docker/build/whisper-bin
          printf 'repo=https://github.com/ggml-org/whisper.cpp\ncommit=%s\n' \
            "${WHISPER_CPP_COMMIT}" \
            > docker/build/whisper-bin/whisper/BUILD_INFO

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Thor ARM64 image
        env:
          RELEASE_TAG: ${{ needs.llama-cpp-refresh.outputs.release_tag }}
          LLAMA_CPP_TAG: ${{ needs.llama-cpp-refresh.outputs.llama_cpp_tag }}
          LLAMA_CPP_URL: ${{ needs.llama-cpp-refresh.outputs.llama_cpp_url }}
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-thor-arm64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:thor-arm64
          IMAGE_LATEST_LOCAL: ${{ env.IMAGE_REPO }}:latest
        run: |
          docker build \
            --platform linux/arm64 \
            -f docker/Dockerfile.thor-arm64 \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.cyberinference.llama-cpp.tag=${LLAMA_CPP_TAG}" \
            --label "org.cyberinference.llama-cpp.revision=${LLAMA_CPP_COMMIT}" \
            --label "org.cyberinference.llama-cpp.source=${LLAMA_CPP_URL}" \
            --label "org.cyberinference.whisper-cpp.revision=${WHISPER_CPP_COMMIT}" \
            -t "${IMAGE_RELEASE}" \
            -t "${IMAGE_FLOATING}" \
            -t "${IMAGE_LATEST_LOCAL}" \
            .

      - name: Smoke test Thor image with NVIDIA runtime
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-thor-arm64
        run: |
          docker run --rm --runtime nvidia --entrypoint /bin/bash "${IMAGE_RELEASE}" -lc '
            set -euo pipefail
            test -x /app/bin/llama-server
            test -f /app/bin/llama/BUILD_INFO
            test -x /app/bin/whisper-server
            test -x /app/bin/whisper/whisper-server
            test -f /app/bin/whisper/BUILD_INFO
            /app/bin/llama-server --version
            command -v whisper-server
            whisper-server --version || whisper-server --help >/dev/null
            if find /app/bin -maxdepth 1 -type f -name "libwhisper*.so*" | grep -q .; then
              echo "whisper libraries were flattened into /app/bin" >&2
              exit 1
            fi
            /app/.venv/bin/python -c "import glob, os, torch; print(torch.cuda.is_available(), torch.version.cuda); assert torch.cuda.is_available(); assert torch.version.cuda; assert not glob.glob(\"/app/bin/transformers*\"); assert not os.path.isdir(\"/app/bin/transformers\")"
          '

      - name: Push Thor ARM64 image
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-thor-arm64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:thor-arm64
        run: |
          docker push "${IMAGE_RELEASE}"
          docker push "${IMAGE_FLOATING}"

  latest:
    name: Publish latest multi-arch image
    needs:
      - llama-cpp-refresh
      - linux-amd64
      - thor-arm64
    if: needs.llama-cpp-refresh.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish latest and version manifests
        env:
          IMAGE_LINUX: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-linux-amd64
          IMAGE_THOR: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}-thor-arm64
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ needs.llama-cpp-refresh.outputs.release_tag }}
          IMAGE_LATEST: ${{ env.IMAGE_REPO }}:latest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_RELEASE}" \
            -t "${IMAGE_LATEST}" \
            "${IMAGE_LINUX}" \
            "${IMAGE_THOR}"

          docker buildx imagetools inspect "${IMAGE_RELEASE}"
          docker buildx imagetools inspect "${IMAGE_LATEST}"

  deploy-thor:
    name: Deploy latest on Thor
    needs:
      - llama-cpp-refresh
      - latest
    if: needs.llama-cpp-refresh.outputs.should_publish == 'true'
    runs-on: [self-hosted, Linux, ARM64, NVIDIA, Thor]
    concurrency:
      group: cyber-inference-thor-deploy
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Replace Thor service with latest image
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:latest
          RELEASE_TAG: ${{ needs.llama-cpp-refresh.outputs.release_tag }}
          DATA_DIR: /home/matt/Local/cyber-inference/data
          MODELS_DIR: /home/matt/Local/cyber-inference/models
        run: |
          set -euo pipefail

          test -d "${DATA_DIR}"
          test -d "${MODELS_DIR}"

          docker pull "${IMAGE}"
          docker image inspect "${IMAGE}" \
            --format 'Deploying image={{.RepoTags}} version={{index .Config.Labels "org.opencontainers.image.version"}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'

          backup_name=""
          if docker container inspect cyber-inference >/dev/null 2>&1; then
            backup_name="cyber-inference-backup-${RELEASE_TAG}-$(date +%Y%m%d%H%M%S)"
            docker inspect cyber-inference \
              --format 'Current container image={{.Config.Image}} version={{index .Config.Labels "org.opencontainers.image.version"}} mounts={{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}'
            docker stop cyber-inference
            docker rename cyber-inference "${backup_name}"
          fi

          docker run -d --name cyber-inference \
            --runtime nvidia \
            -p 8337:8337 \
            -v "${DATA_DIR}:/app/data" \
            -v "${MODELS_DIR}:/app/models" \
            "${IMAGE}"

          healthy=0
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8337/health; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "${healthy}" -ne 1 ]; then
            echo "New container failed health checks; rolling back." >&2
            docker logs --tail 200 cyber-inference >&2 || true
            docker rm -f cyber-inference >/dev/null 2>&1 || true
            if [ -n "${backup_name}" ]; then
              docker rename "${backup_name}" cyber-inference
              docker start cyber-inference
            fi
            exit 1
          fi

          docker inspect cyber-inference \
            --format 'Running container image={{.Config.Image}} version={{index .Config.Labels "org.opencontainers.image.version"}} revision={{index .Config.Labels "org.opencontainers.image.revision"}} mounts={{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}'
