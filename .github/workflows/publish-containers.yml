name: Publish containers

on:
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp git tag or ref to build"
        required: false
        default: "b8816"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ramborogers/cyber-inference
  LLAMA_CPP_REF: ${{ inputs.llama_cpp_ref || vars.LLAMA_CPP_REF || 'b8816' }}

jobs:
  linux-amd64:
    name: Publish Linux AMD64 NVIDIA image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Cyber-Inference
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux-amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.linux-amd64
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:linux-amd64
          build-args: |
            LLAMA_CPP_REF=${{ env.LLAMA_CPP_REF }}

  thor-arm64:
    name: Publish Thor ARM64 NVIDIA image
    runs-on: [self-hosted, linux, ARM64, thor.lab]
    steps:
      - name: Check out Cyber-Inference
        uses: actions/checkout@v4

      - name: Install llama.cpp build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates cmake git ninja-build

      - name: Clone and build llama.cpp for Thor
        run: |
          git clone --depth 1 --branch "${LLAMA_CPP_REF}" https://github.com/ggml-org/llama.cpp llama.cpp
          cd llama.cpp
          cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build --config Release -j$(nproc)

      - name: Stage llama.cpp runtime files
        run: |
          rm -rf docker/build/llama-bin
          docker/scripts/stage-llama-runtime.sh llama.cpp/build docker/build/llama-bin
          docker/build/llama-bin/llama-server --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push thor-arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.thor-arm64
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:thor-arm64
