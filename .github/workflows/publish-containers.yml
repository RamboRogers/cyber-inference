name: Publish containers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish images for
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/ramborogers/cyber-inference
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  linux-amd64:
    name: Build and publish Linux AMD64 NVIDIA image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Linux AMD64 image
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ env.RELEASE_TAG }}-linux-amd64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:linux-amd64
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/Dockerfile.linux-amd64 \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_RELEASE}" \
            -t "${IMAGE_FLOATING}" \
            .

      - name: Smoke test runtime llama.cpp install path
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ env.RELEASE_TAG }}-linux-amd64
        run: |
          docker run --rm --entrypoint /bin/bash "${IMAGE_RELEASE}" -lc '
            uv run cyber-inference install-llama &&
            /app/bin/llama-server --version
          '

      - name: Push Linux AMD64 image
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ env.RELEASE_TAG }}-linux-amd64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:linux-amd64
        run: |
          docker push "${IMAGE_RELEASE}"
          docker push "${IMAGE_FLOATING}"

  thor-arm64:
    name: Build and publish Thor ARM64 NVIDIA image
    runs-on: [self-hosted, Linux, ARM64, NVIDIA, Thor]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Install llama.cpp build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            ninja-build

      - name: Build llama.cpp natively on Thor
        run: |
          rm -rf "${RUNNER_TEMP}/llama.cpp"
          git clone --depth 1 https://github.com/ggml-org/llama.cpp "${RUNNER_TEMP}/llama.cpp"
          cd "${RUNNER_TEMP}/llama.cpp"
          cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build --config Release -j$(nproc)

      - name: Stage llama.cpp runtime bundle
        run: docker/scripts/stage-llama-runtime.sh "${RUNNER_TEMP}/llama.cpp/build" docker/build/llama-bin

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Thor ARM64 image
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ env.RELEASE_TAG }}-thor-arm64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:thor-arm64
        run: |
          docker build \
            --platform linux/arm64 \
            -f docker/Dockerfile.thor-arm64 \
            --label "org.opencontainers.image.version=${RELEASE_TAG}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_RELEASE}" \
            -t "${IMAGE_FLOATING}" \
            .

      - name: Smoke test Thor image with NVIDIA runtime
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ env.RELEASE_TAG }}-thor-arm64
        run: docker run --rm --runtime nvidia --entrypoint /app/bin/llama-server "${IMAGE_RELEASE}" --version

      - name: Push Thor ARM64 image
        env:
          IMAGE_RELEASE: ${{ env.IMAGE_REPO }}:${{ env.RELEASE_TAG }}-thor-arm64
          IMAGE_FLOATING: ${{ env.IMAGE_REPO }}:thor-arm64
        run: |
          docker push "${IMAGE_RELEASE}"
          docker push "${IMAGE_FLOATING}"
